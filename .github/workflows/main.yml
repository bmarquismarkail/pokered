name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install WLA-DX
        run: |
          sudo apt-get update
          sudo apt-get install -yq build-essential wla-dx

      - name: Build and validate Red
        run: make -j$(nproc) check

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install WLA-DX
        run: brew install wla-dx

      - name: Build and validate Red
        run: make -j$(sysctl -n hw.ncpu) check
