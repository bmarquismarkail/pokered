name: CI

env:
  WLA_DX_VERSION: v10.7

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install WLA-DX
        run: |
          sudo apt-get update
          sudo apt-get install -yq build-essential cmake curl
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl -L "https://github.com/vhelin/wla-dx/archive/refs/tags/${WLA_DX_VERSION}.tar.gz" -o "$tmpdir/wla-dx.tar.gz"
          tar -xzf "$tmpdir/wla-dx.tar.gz" -C "$tmpdir"
          cmake -S "$tmpdir/wla-dx-${WLA_DX_VERSION#v}" -B "$tmpdir/build"
          cmake --build "$tmpdir/build" -j"$(nproc)"
          sudo cmake --install "$tmpdir/build"

      - name: Build and validate Red
        run: make -j$(nproc) check

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install WLA-DX
        run: brew install wla-dx

      - name: Build and validate Red
        run: make -j$(sysctl -n hw.ncpu) check
